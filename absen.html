<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Alfacom</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #10b981; --primary-hover: #059669; --surface: #ffffff; --bg: #f7fafc; --text-main: #2d3748; --text-muted: #718096; --border: #e2e8f0; --danger: #ef4444; --warning: #f59e0b; --sla-blue: #1e3a8a;}
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: var(--surface); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; border-top: 6px solid var(--primary); }
        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img { max-width: 130px; }
        h3 { text-align: center; margin: 0 0 5px 0; color: var(--primary); }
        .user-info { text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px dashed var(--border); }
        label { display: block; margin: 15px 0 6px; font-weight: 600; font-size: 13px; }
        select, input[type="text"] { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 14px; background: #f8fafc; }
        select:focus, input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1); }
        
        .gps-box { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 12px; border-radius: 8px; font-size: 12px; margin-top: 15px; display: flex; align-items: center; justify-content: space-between; }
        .gps-box.error { background: #fef2f2; border-color: #fecaca; color: var(--danger); }
        .gps-box.warning { background: #fffbeb; border-color: #fde68a; color: #b45309; }
        
        .btn-absen { background: var(--primary); color: white; border: none; padding: 14px; width: 100%; font-size: 15px; border-radius: 8px; cursor: pointer; font-weight: 700; margin-top: 20px; transition: 0.2s; }
        .btn-absen:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 4px 6px rgba(16,185,129,0.3); }
        .btn-absen:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-back { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 10px; width: 100%; font-size: 13px; border-radius: 8px; cursor: pointer; font-weight: 600; margin-top: 10px; }
        
        #keterangan-section, #foto-section { display: none; margin-top: 15px; }
        .info-text { font-size: 11px; color: var(--danger); margin-top: 5px; }
        
        /* Loading Overlay */
        #loading-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div style="font-weight:600; color:var(--text-main);" id="loading-text">Menyiapkan lokasi...</div>
    </div>

    <div class="card">
        <div class="logo-container">
            <img src="depan_001.png" alt="Alfacom Logo">
        </div>
        <h3>Portal Absensi</h3>
        <div class="user-info" id="user-display">Memeriksa Sesi Login...</div>

        <form id="form-absen" onsubmit="prosesAbsen(event)">
            <label>Tipe Kehadiran</label>
            <select id="tipe-absen" required onchange="cekKondisiAbsen()">
                <option value="" disabled selected>-- Pilih Tipe --</option>
                <option value="Masuk">🟢 Masuk Kerja</option>
                <option value="Masuk Setelah Istirahat">🟡 Masuk Setelah Istirahat</option>
                <option value="Keluar">🔴 Keluar / Pulang</option>
                <option value="Sakit">🏥 Sakit</option>
                <option value="Izin">📝 Izin</option>
                <option value="Koreksi Absen">⚙️ Koreksi Absen (Lupa)</option>
            </select>

            <div class="gps-box" id="gps-status">
                <span>📍 Mencari Lokasi GPS...</span>
            </div>

            <div id="keterangan-section">
                <label id="label-keterangan">Keterangan / Alasan</label>
                <input type="text" id="input-keterangan" placeholder="Ketik alasan di sini...">
            </div>

            <div id="foto-section">
                <label>Foto Bukti (Kamera Langsung)</label>
                <div class="info-text" id="info-foto">Diperlukan foto area/perangkat kerja</div>
                <input type="file" id="input-foto" accept="image/*" capture="environment" style="border:none; padding:0;">
            </div>

            <button type="submit" id="btn-submit" class="btn-absen" disabled>Kirim Absen</button>
            <button type="button" class="btn-back" onclick="kembaliKeSLA()">Kembali ke SLA</button>
        </form>
    </div>

    <script>
        // ==========================================
        // KONFIGURASI SISTEM
        // ==========================================
        const API_ABSEN_URL = "https://script.google.com/macros/s/AKfycbzWjDbDmP8HTkFhnr4i_-HDN4Gozsfa8tuSKnwIszLIphJdtfuUk9R0YdgZyotncqgyfg/exec";
        const API_KEY = "ALFACOM_SECURE_KEY_2026";
        const KANTOR_LAT = -3.9641006831731826;
        const KANTOR_LON = 122.54316001476751;
        const RADIUS_MAKSIMAL = 100; // dalam meter

        let penggunaAktif = null;
        let jarakSekarang = 999999;
        let lokasiDitemukan = false;

        // 1. CEK SSO (SINGLE SIGN ON) DARI LOCALSTORAGE
        window.onload = function() {
            let savedSession = localStorage.getItem('sesiLoginSLA') || sessionStorage.getItem('sesiLoginSLA');
            if (savedSession) {
                try {
                    let parsedSession = JSON.parse(savedSession);
                    if (parsedSession && parsedSession.user) {
                        penggunaAktif = parsedSession.user;
                        document.getElementById('user-display').innerHTML = `<b>${penggunaAktif['Nama Asli']}</b><br>Role: ${penggunaAktif.Role.toUpperCase()}`;
                        dapatkanLokasi();
                    } else { throw new Error("Sesi tidak valid"); }
                } catch(e) {
                    alert("Afwan, sesi login antum tidak valid. Silakan login dari awal.");
                    window.location.href = "index.html";
                }
            } else {
                alert("Afwan, antum harus login terlebih dahulu.");
                window.location.href = "index.html";
            }
        };

        // 2. SISTEM PELACAKAN GPS (HAVERSINE FORMULA)
        function hitungJarak(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Radius bumi (meter)
            const p1 = lat1 * Math.PI/180; const p2 = lat2 * Math.PI/180;
            const dp = (lat2-lat1) * Math.PI/180; const dl = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return Math.round(R * c);
        }

        function dapatkanLokasi() {
            const gpsBox = document.getElementById('gps-status');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        let lat = position.coords.latitude;
                        let lon = position.coords.longitude;
                        jarakSekarang = hitungJarak(KANTOR_LAT, KANTOR_LON, lat, lon);
                        lokasiDitemukan = true;
                        
                        if (jarakSekarang <= RADIUS_MAKSIMAL) {
                            gpsBox.className = "gps-box";
                            gpsBox.innerHTML = `<span>🏢 Jarak Kantor: <b>${jarakSekarang}m</b></span> <span style="color:var(--success); font-weight:bold;">Aman</span>`;
                        } else {
                            gpsBox.className = "gps-box warning";
                            gpsBox.innerHTML = `<span>🌍 Luar Kantor: <b>${jarakSekarang}m</b></span> <span>Wajib Keterangan</span>`;
                        }
                        cekKondisiAbsen(); // Re-evaluasi form
                    },
                    (error) => {
                        gpsBox.className = "gps-box error";
                        gpsBox.innerHTML = "❌ Izin GPS Ditolak / Gagal.";
                        jarakSekarang = 999999;
                        lokasiDitemukan = false;
                        cekKondisiAbsen();
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                gpsBox.className = "gps-box error"; gpsBox.innerHTML = "❌ Browser tidak support GPS.";
            }
        }

        // 3. LOGIKA BISNIS & ATURAN JAM KERJA
        function cekKondisiAbsen() {
            const tipe = document.getElementById('tipe-absen').value;
            const ketSection = document.getElementById('keterangan-section');
            const inputKet = document.getElementById('input-keterangan');
            const fotoSection = document.getElementById('foto-section');
            const inputFoto = document.getElementById('input-foto');
            const btnSubmit = document.getElementById('btn-submit');
            const now = new Date();
            const jam = now.getHours(); const menit = now.getMinutes();
            
            let butuhKet = false; let butuhFoto = false;
            let placeholderKet = "Ketik alasan di sini...";

            if (!tipe || !lokasiDitemukan) { btnSubmit.disabled = true; return; }

            // Logika Tipe Absen
            if (tipe === 'Sakit' || tipe === 'Izin') {
                butuhKet = true; butuhFoto = true;
                placeholderKet = "Sebutkan alasan / sakit apa...";
                document.getElementById('info-foto').innerText = "Wajib lampirkan foto surat dokter / bukti izin";
            } else if (tipe === 'Koreksi Absen') {
                butuhKet = true;
                placeholderKet = "Alasan lupa absen (Sisa Max 7x)...";
            } else {
                // Jika Hadir/Masuk/Keluar tapi di Luar Radius
                if (jarakSekarang > RADIUS_MAKSIMAL) {
                    butuhKet = true;
                    placeholderKet = "Mengerjakan apa di luar kantor?";
                }
                
                // Aturan Lembur Malam (> 20:00)
                if (tipe === 'Keluar' && (jam >= 20)) {
                    butuhKet = true; butuhFoto = true;
                    placeholderKet = "Pekerjaan lembur yang diselesaikan...";
                    document.getElementById('info-foto').innerText = "Wajib foto bukti kerjaan / lokasi lembur malam";
                }
            }

            ketSection.style.display = butuhKet ? "block" : "none";
            inputKet.required = butuhKet;
            inputKet.placeholder = placeholderKet;
            
            fotoSection.style.display = butuhFoto ? "block" : "none";
            inputFoto.required = butuhFoto;

            btnSubmit.disabled = false;
        }

        function tentukanStatusDisiplin(tipe) {
            const now = new Date(); const h = now.getHours(); const m = now.getMinutes();
            let waktuAngka = h + (m/60); // Desimal jam

            if (tipe === 'Masuk') {
                if (waktuAngka <= 8.0) return "Tepat Waktu";
                else if (waktuAngka <= 8.75) return "Toleransi (8.00 - 8.45)";
                else return "Terlambat (Diatas 08:45)";
            } else if (tipe === 'Masuk Setelah Istirahat') {
                if (waktuAngka > 13.5) return "Terlambat (Potongan 1.5 Jam)";
                return "Tepat Waktu";
            } else if (tipe === 'Keluar') {
                if (waktuAngka >= 20.0) return "Lembur Ekstrem Malam";
                else if (waktuAngka >= 17.0) return "Lembur";
                else return "Keluar Normal";
            }
            return "-";
        }

        // 4. PROSES UPLOAD FOTO & SUBMIT DATA
        function kompresFoto(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800; // Kompresi kuat agar Drive tidak penuh
                        let width = img.width; let height = img.height;
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
                reader.onerror = error => reject(error);
            });
        }

        async function prosesAbsen(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const overlay = document.getElementById('loading-overlay');
            const textLoading = document.getElementById('loading-text');
            
            overlay.style.display = 'flex';
            textLoading.innerText = "Mengamankan data kehadiran...";

            try {
                let base64Foto = "";
                const fileInput = document.getElementById('input-foto');
                if (fileInput.files.length > 0) {
                    textLoading.innerText = "Mengompres & mengirim foto ke Drive...";
                    base64Foto = await kompresFoto(fileInput.files[0]);
                }

                const tipeAbsen = document.getElementById('tipe-absen').value;
                const statusDisiplin = tentukanStatusDisiplin(tipeAbsen);

                const payload = {
                    apiKey: API_KEY,
                    username: penggunaAktif.Username,
                    passwordHash: penggunaAktif.Password, // Keamanan Berlapis
                    namaAsli: penggunaAktif['Nama Asli'],
                    role: penggunaAktif.Role,
                    tipeAbsen: tipeAbsen,
                    jarakMeter: jarakSekarang,
                    statusDisiplin: statusDisiplin,
                    keterangan: document.getElementById('input-keterangan').value,
                    fotoBase64: base64Foto
                };

                textLoading.innerText = "Mencatat ke database Alfacom...";
                
                const response = await fetch(API_ABSEN_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const hasil = await response.json();
                
                if (hasil.status === 'sukses') {
                    alert("✅ Alhamdulillah: " + hasil.pesan);
                    window.location.href = "index.html"; // Balik ke portal
                } else {
                    alert("❌ Afwan: " + hasil.pesan);
                }
            } catch (err) {
                alert("❌ Kesalahan Jaringan: Gagal menghubungi server absensi.");
            } finally {
                overlay.style.display = 'none';
            }
        }

        function kembaliKeSLA() { window.location.href = "index.html"; }
    </script>
</body>
</html>
